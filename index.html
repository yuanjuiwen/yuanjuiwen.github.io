<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Website</title>
    <style>
      :root {
        --nav-bg: rgba(255, 255, 255, 0.58);
        --nav-text: #111827;
        --nav-link: rgba(17, 24, 39, 0.75);
        --nav-link-hover: #111827;
        --nav-border: rgba(255, 255, 255, 0.65);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
        background: #f3f4f6;
        color: #111827;
      }

      .navbar {
        background: var(--nav-bg);
        color: var(--nav-text);
        position: sticky;
        top: 0;
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
        border-bottom: 1px solid var(--nav-border);
        box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
      }

      .navbar-inner {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0.875rem 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 700;
      }

      .nav-links {
        list-style: none;
        display: flex;
        gap: 1rem;
        margin: 0;
        padding: 0;
      }

      .nav-links a {
        color: var(--nav-link);
        text-decoration: none;
        font-size: 0.95rem;
        transition: color 0.15s ease, opacity 0.15s ease;
      }

      .nav-links a:hover {
        color: var(--nav-link-hover);
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-inner">
        <h1 class="brand">Wen's Site</h1>
        <ul class="nav-links">
          <li><a href="#home">首頁</a></li>
          <li><a href="#about">關於我</a></li>
          <li><a href="#projects">作品集</a></li>
          <li><a href="#contact">聯絡我</a></li>
        </ul>
      </div>
    </nav>

    <main>
      <section id="home">
        <h2>Welcome</h2>
        <p>這裡是網站內容區域。</p>
      </section>
    </main>
  </body>
</html>
