    <script src="theme-init.js"></script>

    <title>Lifebuoy | Kevin Wen</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-lifebuoy">
    <div class="page-transition-overlay" aria-hidden="true"></div>
    <nav class="navbar">
      <div class="navbar-inner">
        <h1 class="brand"><a href="index.html">Kevin Wen</a></h1>
        <div class="navbar-tools">
        <ul class="nav-links">
          <li><a href="index.html#work" data-i18n="nav.work">work</a></li>
          <li><a href="index.html#play" data-i18n="nav.play">play</a></li>
          <li><a href="about.html" data-i18n="nav.about">about</a></li>
          <li>
            <a
              href="https://drive.google.com/file/d/1zUd77evxGmOmOf-U2A0rWiG_1yQkBVCH/view?usp=sharing"
              target="_blank"
              rel="noopener noreferrer"

              aria-label="Open resume as PDF"
              >resume</a
            >
          </li>
        </ul>
        </div>

    <main class="project-page project-page--wide">
      <div class="project-page-media project-page-media--gray-panel project-page-media--no-border project-page-media--no-bg">
        <div
          class="project-image-slot project-image-slot--feature project-image-slot--filled"
          role="img"
          aria-label="Lifebuoy project cover"
        >
          <img
            class="project-image-slot__img"
            src="assets/lifebuoy.png"
            alt="Lifebuoy project cover"
            loading="lazy"
            decoding="async"
            draggable="false"
          />
        </div>
      </div>

      <section class="project-page-lead" aria-labelledby="lifebuoy-lead-heading">
        <h2 id="lifebuoy-lead-heading" class="project-page-lead__title">Lifebuoy</h2>
        <p class="project-page-desc">
          Reimagining how a drowning person enters the lifebuoy, enabling them to receive rescue support with less
          effort and in a more instinctive posture, while maintaining stability and safety even in chaotic conditions.
        </p>
      </section>

      <section class="project-case-study-soon" lang="en" aria-label="Case study status">
        <p class="project-case-study-soon__text">Case Study Coming Soon</p>
      </section>

    <script src="page-transitions.js" defer></script>
