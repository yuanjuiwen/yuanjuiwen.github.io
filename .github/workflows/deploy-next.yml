# Builds next-app/ and publishes it to GitHub Pages.
#
# It only runs when started by hand (Actions tab → "Deploy Next.js site" → Run workflow),
# so the current HTML site stays live until you're ready to switch.
# Before the first run: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# To deploy on every push to main afterwards, add `push: { branches: [main] }` under `on:`.
name: Deploy Next.js site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: next-app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
